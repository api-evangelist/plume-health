name: Plume Health
description: >-
  Plume Health (Plume) is a telehealth company delivering gender-affirming care to
  transgender and gender non-conforming people across the United States. Through a
  mobile app and licensed clinicians, Plume provides gender-affirming hormone therapy
  (estrogen and testosterone), mental health support, medical letters for surgery and
  identification changes, and everyday clinical care, all on a monthly membership
  subscription. Founded in 2019 and backed by General Catalyst, Plume operates as a
  HIPAA-covered, LegitScript-certified consumer healthcare provider. It is a
  consumer-facing care service and does not currently publish a public developer API
  or developer portal.
